<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><script>try{document.documentElement.dataset.theme=localStorage.getItem("portfolio-theme")==="light"?"light":"dark";}catch(e){document.documentElement.dataset.theme="dark";}</script><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>Login | Arthur Couto</title><link rel="stylesheet" href="../shared/css/base.css"><link rel="stylesheet" href="../login/style.css"><script src="../shared/js/common.js" defer></script><script src="../shared/js/background.js" defer></script><script src="../shared/js/auth.js" defer></script><script src="./script.js" defer></script></head><body><canvas id="constellation-background" data-image="../assets/maos-constelacao.png" aria-hidden="true"></canvas><a class="skip-link" href="#conteudo">Pular para o conteúdo</a><header class="exercise-header"><nav aria-label="Navegação"><a class="nav-button" href="../index.html">Menu</a></nav></header><main id="conteudo" class="container auth-page"><section class="auth-card"><h1>Área dos alunos<span>.</span></h1><p class="auth-intro">Entre para acessar Exercícios e Apoio.</p><div class="auth-tabs" role="tablist" aria-label="Acesso"><button type="button" role="tab" data-auth-tab="login" aria-selected="true">Entrar</button><button type="button" role="tab" data-auth-tab="register" aria-selected="false">Criar conta</button></div><p id="auth-message" role="status" aria-live="polite"></p><form id="login-form"><label>E-mail<input name="email" type="email" autocomplete="username" maxlength="254" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" maxlength="128" required></label><button type="submit" class="auth-submit">Entrar</button><p class="auth-note">Se esqueceu sua senha, entre em contato com o professor.</p></form><form id="register-form" hidden><label>Nome<input name="name" autocomplete="name" maxlength="100" required></label><label>E-mail<input name="email" type="email" autocomplete="email" maxlength="254" required></label><label>Senha — pelo menos 12 caracteres<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><label>Confirme a senha<input name="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><button type="submit" class="auth-submit">Solicitar acesso</button><p class="auth-note">Seu acesso será liberado após a aprovação do professor.</p></form><section id="account-panel" hidden><h2>Olá, <span id="account-name"></span>.</h2><div class="account-panel-links"><a href="../exercicios/index.html">Exercícios</a><a href="../apoio/index.html">Apoio</a><a href="../alunos/index.html" id="student-panel-link" hidden>Gerenciar alunos</a></div><h2>Alterar senha</h2><form id="password-form"><label>Senha atual<input name="currentPassword" type="password" autocomplete="current-password" maxlength="128" required></label><label>Nova senha<input name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><label>Confirme a nova senha<input name="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><button type="submit" class="auth-submit">Salvar nova senha</button></form></section></section></main></body></html>
